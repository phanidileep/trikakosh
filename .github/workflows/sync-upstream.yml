name: Sync upstream

on:
  schedule:
    - cron: '17 17 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-master

jobs:
  sync:
    if: github.repository == 'phanidileep/trikakosh' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge upstream master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/phanidileep/trikakosh/merge-upstream \
            --field branch=master
